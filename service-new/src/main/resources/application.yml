spring:
  application:
    name: lookation
  # 로컬 프로필을 기본값으로 둔다. `SPRING_PROFILES_ACTIVE`가 있으면 그쪽이 이긴다.
  # 배포 환경은 프로필을 반드시 지정해야 한다 — 빠뜨리면 application-local.yml이 적용되어
  # localhost:24566(MiniStack)에 접속을 시도하고 기동에 실패한다.
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LOOKATION_DB_URL}
    username: ${LOOKATION_DB_USERNAME}
    password: ${LOOKATION_DB_PASSWORD}
  flyway:
    enabled: true

server:
  port: ${LOOKATION_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    # 섹션·오퍼레이션 정렬과 Authorize 값 유지(새로고침해도 토큰이 남는다).
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
    display-request-duration: true

lookation:
  encryption:
    key: ${LOOKATION_ENCRYPTION_KEY}
  upload-dir: ${LOOKATION_UPLOAD_DIR:./uploads}
  html:
    # 배포(HTTPS)에서는 true. 로컬 HTTP에서는 false여야 브라우저가 쿠키를 저장한다.
    secure-cookie: ${LOOKATION_SECURE_COOKIE:false}
    # 두 탭이 동시에 refresh할 때 family를 폐기하지 않는 유예 시간.
    reuse-grace: 10s
  admin:
    email: ${LOOKATION_ADMIN_EMAIL:}
    password: ${LOOKATION_ADMIN_PASSWORD:}
  jwt:
    secret: ${LOOKATION_JWT_SECRET}
    issuer: lookation
    access-ttl: 15m
    refresh-ttl: 14d
