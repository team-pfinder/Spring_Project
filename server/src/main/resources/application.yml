spring:
  application:
    name: lookation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LOOKATION_DB_URL}
    username: ${LOOKATION_DB_USERNAME}
    password: ${LOOKATION_DB_PASSWORD}
  flyway:
    enabled: true

server:
  port: ${LOOKATION_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

lookation:
  encryption:
    key: ${LOOKATION_ENCRYPTION_KEY}
  upload-dir: ${LOOKATION_UPLOAD_DIR:./uploads}
  admin:
    email: ${LOOKATION_ADMIN_EMAIL:}
    password: ${LOOKATION_ADMIN_PASSWORD:}
  jwt:
    secret: ${LOOKATION_JWT_SECRET}
    issuer: lookation
    access-ttl: 15m
    refresh-ttl: 14d
