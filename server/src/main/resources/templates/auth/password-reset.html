<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>비밀번호 재설정 · Lookation</title>
</head>
<body>
<section>
    <div class="auth-wrap">
        <div class="page-head text-center">
            <h1>비밀번호 재설정</h1>
            <p>가입한 이메일로 인증 코드를 보내드려요.</p>
        </div>

        <div class="auth-card mb-3">
            <h2 class="h5 font-weight-bold mb-3">1. 인증 코드 요청</h2>
            <form th:action="@{/password-reset}" th:object="${emailForm}" method="post" class="form-inline" novalidate>
                <input type="email" class="form-control mr-2 flex-grow-1" th:field="*{email}"
                       placeholder="you@example.com" autocomplete="email">
                <button type="submit" class="btn btn-outline-dark">코드 받기</button>
                <small class="text-danger w-100 mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </form>
        </div>

        <div class="auth-card">
            <h2 class="h5 font-weight-bold mb-3">2. 새 비밀번호 설정</h2>
            <form th:action="@{/password-reset/confirm}" th:object="${form}" method="post" novalidate>
                <div class="form-group">
                    <label for="reset-email">이메일</label>
                    <input type="email" class="form-control" id="reset-email" th:field="*{email}" autocomplete="email">
                    <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>
                <div class="form-group">
                    <label for="reset-code">인증 코드</label>
                    <input type="text" class="form-control" id="reset-code" th:field="*{code}" inputmode="numeric" maxlength="6">
                    <small class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small>
                </div>
                <div class="form-group">
                    <label for="new-password">새 비밀번호</label>
                    <input type="password" class="form-control" id="new-password" th:field="*{newPassword}"
                           autocomplete="new-password">
                    <small class="text-danger" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
                </div>
                <button type="submit" class="btn btn-warning btn-block font-weight-bold">비밀번호 변경</button>
            </form>
            <div class="text-center auth-links mt-4">
                <a th:href="@{/login}">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
