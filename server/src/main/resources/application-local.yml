# Local development profile. Values here are NOT secrets; secrets come from MiniStack
# (docker compose up -d --wait) through SecretsEnvironmentPostProcessor.
spring:
  datasource:
    url: jdbc:postgresql://localhost:25432/lookation
    username: lookation
  mail:
    host: localhost
    port: 21025

lookation:
  secrets:
    enabled: true
    endpoint: http://localhost:24566
    region: us-east-1
    access-key: test
    secret-key: test
    name: lookation/local
  upload-dir: ./uploads
  admin:
    email: admin@lookation.local
  seed:
    enabled: true
