<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>예약 상세 · Lookation</title>
</head>
<body>
<section>
    <div class="page-head d-flex flex-wrap justify-content-between align-items-end">
        <div>
            <div class="small text-muted mb-2">예약 상세</div>
            <h1 th:text="${reservation.spaceName}">공간 이름</h1>
            <p>
                <span class="badge status-badge"
                      th:classappend="${@fmt.badgeClass(reservation.status)}"
                      th:text="${@fmt.status(reservation.status)}">상태</span>
            </p>
        </div>
        <a class="btn btn-outline-dark mt-3 mt-md-0" th:href="@{/mypage/reservations}">목록으로</a>
    </div>

    <div id="reservation-error" class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}"></div>

    <div class="row">
        <div class="col-lg-7">
            <div class="info-card mb-4">
                <h2 class="h5 font-weight-bold mb-3">예약 정보</h2>
                <dl class="detail-list mb-0">
                    <dt>이용 일시</dt>
                    <dd th:text="|${@fmt.dateTime(reservation.startAt)} ~ ${@fmt.dateTime(reservation.endAt)}|"></dd>
                    <dt>이용 인원</dt>
                    <dd th:text="|${reservation.guestCount}명|"></dd>
                    <dt>결제 금액</dt>
                    <dd th:text="${@fmt.won(reservation.price)}"></dd>
                    <dt th:if="${reservation.status.name == 'PENDING_PAYMENT'}">결제 시한</dt>
                    <dd th:if="${reservation.status.name == 'PENDING_PAYMENT'}" th:text="${@fmt.dateTime(reservation.paymentDueAt)}"></dd>
                    <dt th:if="${reservation.refundedAmount != null}">환불 금액</dt>
                    <dd th:if="${reservation.refundedAmount != null}" class="text-danger"
                        th:text="${@fmt.won(reservation.refundedAmount)}"></dd>
                    <dt>예약일</dt>
                    <dd th:text="${@fmt.dateTime(reservation.createdAt)}"></dd>
                    <dt th:if="${reservation.requestMessage != null}">요청 사항</dt>
                    <dd th:if="${reservation.requestMessage != null}" class="font-weight-normal preline"
                        th:text="${reservation.requestMessage}"></dd>
                </dl>
            </div>

            <div class="info-card">
                <h2 class="h5 font-weight-bold mb-3">다음 할 일</h2>
                <div th:if="${reservation.status.name == 'PENDING_PAYMENT'}">
                    <p class="text-muted">호스트가 예약을 승인했습니다. 결제 시한 안에 결제해 주세요.</p>
                    <a class="btn btn-warning font-weight-bold" th:href="@{/reservations/{id}/pay(id=${reservation.id})}">결제하기</a>
                </div>
                <div th:if="${reservation.status.name == 'PENDING_APPROVAL'}">
                    <p class="text-muted mb-0">호스트의 승인을 기다리고 있습니다. 승인되면 결제할 수 있어요.</p>
                </div>
                <div th:if="${reservation.status.name == 'CONFIRMED'}">
                    <p class="text-muted mb-0">예약이 확정되었습니다. 이용일에 공간에서 만나요!</p>
                </div>
                <div th:if="${reservation.status.name == 'COMPLETED'}">
                    <p class="text-muted mb-0">이용이 완료된 예약입니다. 리뷰를 남겨 주세요.</p>
                </div>
                <div th:if="${reservation.canCancel}">
                    <hr>
                    <p class="text-muted small">취소 시 이용 시작일까지 남은 기간에 따라 마일리지가 환불됩니다.</p>
                    <form th:action="@{/mypage/reservations/{id}/cancel(id=${reservation.id})}" method="post"
                          onsubmit="return confirm('예약을 취소할까요?');">
                        <button type="submit" class="btn btn-outline-danger">예약 취소</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="info-card">
                <h2 class="h5 font-weight-bold mb-3">공간 정보</h2>
                <dl class="detail-list mb-0">
                    <dt>공간</dt>
                    <dd>
                        <a th:href="@{/spaces/{id}(id=${reservation.spaceId})}" th:text="${reservation.spaceName}"></a>
                    </dd>
                    <dt>예약 번호</dt>
                    <dd th:text="|#${reservation.id}|"></dd>
                </dl>
            </div>
        </div>
    </div>
</section>
</body>
</html>
